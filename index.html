
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miles Per Gallon Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator">
    <div class="logo">🚗</div>
    <h1>MPG Calculator</h1>
    <p>Calculate your car's fuel efficiency.</p>

    <form id="mpgForm">
      <label for="miles">Miles Traveled</label>
      <input type="number" id="miles" min="0" step="any"
             placeholder="Example: 300" required>

      <label for="gallons">Gallons of Gas Used</label>
      <input type="number" id="gallons" min="0.000001"
             step="any" placeholder="Example: 10" required>

      <button type="submit">Calculate MPG</button>
    </form>

    <div id="result" aria-live="polite"></div>
    <footer>Created by Mohammed Awuf</footer>
  </main>
</body>
</html>
